spring:
  application:
    name: PromptCraft
    description: AI-powered app builder application inspired by Lovable.dev
  # Load local secrets (.env at repo root, gitignored) so the app also boots when
  # launched from IntelliJ, which does not inherit shell environment variables.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:9010/pgvector-test
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
#      ddl-auto: create
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: deepseek/deepseek-v4-flash
          temperature: 0.0

